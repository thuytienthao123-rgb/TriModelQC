<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual BBox Drawer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f1624;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
      overflow: hidden;
      padding: 6px;
    }
    #wrapper {
      background: #0b111e;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: #94a3b8;
      font-family: monospace;
    }
    .badge-guide {
      background: rgba(0, 229, 255, 0.12);
      color: #00e5ff;
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    #canvas-container {
      position: relative;
      display: inline-block;
      width: 100%;
      background: #050811;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #1e293b;
      line-height: 0;
    }
    canvas {
      display: block;
      cursor: crosshair;
      width: 100%;
      height: auto;
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: #64748b;
      font-family: monospace;
      padding-top: 2px;
    }
    .highlight-txt {
      color: #10b981;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div class="status-bar">
      <span class="badge-guide">🖱️ KÉO THẢ CHUỘT ĐỂ VẼ BOX</span>
      <span id="label-tag" style="color: #00e5ff; font-weight: 700;">LỚP: CAR</span>
    </div>
    <div id="canvas-container">
      <canvas id="c"></canvas>
    </div>
    <div class="footer-bar">
      <span id="coord-hud">Di chuột vào ảnh để ngắm</span>
      <span id="box-hud" class="highlight-txt">Chưa vẽ</span>
    </div>
  </div>

  <script>
    // Streamlit Component Messaging API
    function sendMessage(type, data) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
    }
    function sendValue(val) { sendMessage("streamlit:setComponentValue", { value: val }); }
    function setFrameHeight(h) { sendMessage("streamlit:setFrameHeight", { height: h }); }

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const labelTag = document.getElementById("label-tag");
    const coordHud = document.getElementById("coord-hud");
    const boxHud = document.getElementById("box-hud");

    let bgImage = new Image();
    let imgLoaded = false;
    let isDrawing = false;
    let startX = 0, startY = 0;
    let currX = 0, currY = 0;
    let origW = 1920, origH = 1080;
    let currentLabel = "car";
    let drawnBox = null;

    function renderCanvas() {
      if (!imgLoaded) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

      const scaleX = origW / canvas.width;
      const scaleY = origH / canvas.height;

      // 1. Vẽ box đang kéo chuột
      if (isDrawing) {
        const x = Math.min(startX, currX);
        const y = Math.min(startY, currY);
        const w = Math.abs(currX - startX);
        const h = Math.abs(currY - startY);

        ctx.fillStyle = "rgba(0, 229, 255, 0.22)";
        ctx.fillRect(x, y, w, h);

        ctx.setLineDash([5, 3]);
        ctx.strokeStyle = "#00e5ff";
        ctx.lineWidth = 2.2;
        ctx.strokeRect(x, y, w, h);
        ctx.setLineDash([]);

        // Label Tag góc box
        const tagW = Math.max(80, currentLabel.length * 8 + 65);
        ctx.fillStyle = "#00e5ff";
        ctx.fillRect(x, Math.max(0, y - 18), tagW, 18);
        ctx.fillStyle = "#080c14";
        ctx.font = "bold 10px monospace";
        ctx.fillText(`${currentLabel} (${Math.round(w*scaleX)}×${Math.round(h*scaleY)})`, x + 4, Math.max(13, y - 4));
      }
      // 2. Vẽ box đã vẽ xong
      else if (drawnBox) {
        const bx = drawnBox.x1 / scaleX;
        const by = drawnBox.y1 / scaleY;
        const bw = (drawnBox.x2 - drawnBox.x1) / scaleX;
        const bh = (drawnBox.y2 - drawnBox.y1) / scaleY;

        ctx.fillStyle = "rgba(16, 185, 129, 0.25)";
        ctx.fillRect(bx, by, bw, bh);

        ctx.strokeStyle = "#10b981";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx, by, bw, bh);

        // 4 góc điểm neo (handles)
        ctx.fillStyle = "#ffffff";
        const hs = 4;
        ctx.fillRect(bx - hs, by - hs, hs*2, hs*2);
        ctx.fillRect(bx + bw - hs, by - hs, hs*2, hs*2);
        ctx.fillRect(bx - hs, by + bh - hs, hs*2, hs*2);
        ctx.fillRect(bx + bw - hs, by + bh - hs, hs*2, hs*2);

        // Nhãn lớp
        const tagW = Math.max(80, currentLabel.length * 8 + 65);
        ctx.fillStyle = "#10b981";
        ctx.fillRect(bx, Math.max(0, by - 18), tagW, 18);
        ctx.fillStyle = "#080c14";
        ctx.font = "bold 10px monospace";
        ctx.fillText(`${currentLabel} (${Math.round(drawnBox.x2 - drawnBox.x1)}×${Math.round(drawnBox.y2 - drawnBox.y1)})`, bx + 4, Math.max(13, by - 4));
      }
    }

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: Math.max(0, Math.min(canvas.width, (clientX - rect.left) * scaleX)),
        y: Math.max(0, Math.min(canvas.height, (clientY - rect.top) * scaleY))
      };
    }

    function handleStart(e) {
      if (!imgLoaded) return;
      e.preventDefault();
      const pos = getCanvasPos(e);
      isDrawing = true;
      startX = pos.x;
      startY = pos.y;
      currX = pos.x;
      currY = pos.y;
      drawnBox = null;
      boxHud.innerText = "Đang kéo...";
      renderCanvas();
    }

    function handleMove(e) {
      if (!imgLoaded) return;
      const pos = getCanvasPos(e);
      const scaleX = origW / canvas.width;
      const scaleY = origH / canvas.height;
      coordHud.innerText = `X: ${Math.round(pos.x * scaleX)}, Y: ${Math.round(pos.y * scaleY)}`;

      if (isDrawing) {
        e.preventDefault();
        currX = pos.x;
        currY = pos.y;
        const w = Math.round(Math.abs(currX - startX) * scaleX);
        const h = Math.round(Math.abs(currY - startY) * scaleY);
        boxHud.innerText = `[${w}×${h} px]`;
        renderCanvas();
      }
    }

    function handleEnd(e) {
      if (!isDrawing) return;
      isDrawing = false;
      const scaleX = origW / canvas.width;
      const scaleY = origH / canvas.height;

      const x1 = Math.round(Math.min(startX, currX) * scaleX);
      const y1 = Math.round(Math.min(startY, currY) * scaleY);
      const x2 = Math.round(Math.max(startX, currX) * scaleX);
      const y2 = Math.round(Math.max(startY, currY) * scaleY);
      const bw = x2 - x1;
      const bh = y2 - y1;

      if (bw >= 10 && bh >= 10) {
        drawnBox = { x1: x1, y1: y1, x2: x2, y2: y2 };
        boxHud.innerText = `✅ Đã chọn [${bw}×${bh}]`;
        renderCanvas();
        // Gửi kết quả vẽ ngay lập tức về Streamlit!
        sendValue({
          x1: x1,
          y1: y1,
          x2: x2,
          y2: y2,
          category: currentLabel,
          time: Date.now()
        });
      } else {
        boxHud.innerText = "Hủy (quá nhỏ)";
        drawnBox = null;
        renderCanvas();
      }
    }

    canvas.addEventListener("mousedown", handleStart);
    window.addEventListener("mousemove", handleMove);
    window.addEventListener("mouseup", handleEnd);

    canvas.addEventListener("touchstart", handleStart, { passive: false });
    window.addEventListener("touchmove", handleMove, { passive: false });
    window.addEventListener("touchend", handleEnd, { passive: false });

    // Lắng nghe sự kiện Render từ Streamlit
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "streamlit:render") {
        const args = event.data.args || {};
        if (args.label) {
          currentLabel = args.label;
          labelTag.innerText = `LỚP: ${currentLabel.toUpperCase()}`;
        }
        if (args.orig_w) origW = args.orig_w;
        if (args.orig_h) origH = args.orig_h;

        if (args.img_b64) {
          const newSrc = "data:image/jpeg;base64," + args.img_b64;
          if (bgImage.src !== newSrc) {
            bgImage.onload = function() {
              imgLoaded = true;
              const displayW = args.display_w || 400;
              canvas.width = displayW;
              canvas.height = Math.round(displayW * (bgImage.naturalHeight / bgImage.naturalWidth));
              renderCanvas();
              setTimeout(() => {
                setFrameHeight(document.getElementById("wrapper").scrollHeight + 16);
              }, 60);
            };
            bgImage.src = newSrc;
          } else {
            renderCanvas();
            setFrameHeight(document.getElementById("wrapper").scrollHeight + 16);
          }
        }
      }
    });

    // Thông báo cho Streamlit component đã sẵn sàng
    sendMessage("streamlit:componentReady", { apiVersion: 1 });
    setTimeout(() => {
      setFrameHeight(document.getElementById("wrapper").scrollHeight + 20);
    }, 150);
  </script>
</body>
</html>
